<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Itihasika Books Hero, Real Children</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Josefin+Sans:wght@700&family=League+Spartan:wght@600;700;800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&display=swap">
<style>/* Itihasika concept, styled after the Itihasika homepage Figma (itihasika2-basab) */
:root{
  --yellow:#FEC905; --yellow-d:#E5B400; --red:#D2522E; --blue:#4BA3E3; --blue-d:#2F8ACB;
  --navy:#121A2C; --navy-2:#1C2540; --foot:#1D1D1D; --cream:#F1E8D0; --grey:#EEEEEF; --peach:#FBE3D6;
  --ink:#141414; --soft:#4B4B4B; --mute:#7A7A7A; --line:rgba(20,20,20,.12); --white:#fff;
  --f-hero:"League Spartan",system-ui,sans-serif; --f-serif:"Playfair Display",Georgia,serif; --f-sans:"Poppins",system-ui,sans-serif;
  --gut:clamp(16px,4vw,80px); --ease:cubic-bezier(.2,.8,.2,1); --shadow:0 12px 34px rgba(20,20,20,.10);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
html,body{overflow-x:clip}
body{font-family:var(--f-sans);font-size:16px;line-height:1.65;color:var(--ink);background:var(--white);-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%;height:auto}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:6px}
.wrap{width:100%;max-width:1760px;margin:0 auto;padding:0 var(--gut)}
.sr{position:absolute;left:-9999px}
.skip{position:absolute;left:-9999px;top:10px;z-index:200;background:var(--yellow);padding:10px 14px;border-radius:99px;font-weight:600}
.skip:focus{left:10px}

/* type */
.serif{font-family:var(--f-serif);font-weight:500;letter-spacing:-.01em;line-height:1.12}
.serif em{font-style:italic;color:var(--red)}
.h2{font-size:clamp(32px,4vw,52px)}
.h3{font-size:clamp(26px,2.8vw,36px)}
.center{text-align:center}
.sub{color:var(--soft);font-size:15.5px;max-width:60ch}
.center .sub{margin-inline:auto}
.label{display:inline-flex;align-items:center;gap:16px;font-weight:600;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--red)}
.label::before{content:"";width:34px;height:1.5px;background:currentColor}
.label--both::after{content:"";width:34px;height:1.5px;background:currentColor}
@media (max-width:520px){.label{letter-spacing:.14em;gap:10px;font-size:12px}.label::before,.label--both::after{width:20px}}
.hero-type{font-family:var(--f-hero);font-weight:700;letter-spacing:-.015em;line-height:1.02}
.hero-type .y{color:var(--yellow)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 24px;border-radius:999px;font-weight:600;font-size:14px;border:1.5px solid transparent;cursor:pointer;white-space:nowrap;transition:transform .3s var(--ease),background .25s,box-shadow .3s,color .25s}
.btn:hover{transform:translateY(-2px)}
.btn--yellow{background:var(--yellow);color:var(--ink)}
.btn--yellow:hover{background:var(--yellow-d);box-shadow:0 10px 24px rgba(254,201,5,.35)}
.btn--white{background:#fff;color:var(--ink)}
.btn--white:hover{box-shadow:0 10px 24px rgba(0,0,0,.18)}
.btn--blue{background:var(--blue);color:#fff;border-radius:8px}
.btn--blue:hover{background:var(--blue-d);box-shadow:0 10px 24px rgba(75,163,227,.35)}
.btn--line{border-color:var(--ink);color:var(--ink);background:transparent}
.btn--line:hover{background:var(--ink);color:#fff}
.link{font-weight:600;font-size:13.5px;letter-spacing:.04em;color:#1E5FA8;text-decoration:underline;text-underline-offset:4px;text-transform:uppercase}

/* header (dark pill over the hero, as in the Figma) */
.hdr{position:fixed;left:0;right:0;top:0;z-index:60;padding:14px 0;transition:background .35s,padding .35s,box-shadow .35s}
.hdr.scrolled{background:rgba(18,26,44,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:8px 0;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.hdr__in{display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:6px;margin-right:auto;flex:none}
.logo img{height:52px;width:auto;filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 1px #fff) drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.logo b{font-family:var(--f-hero);font-size:11px;background:#fff;color:var(--ink);border-radius:4px;padding:1px 4px;transform:translateY(8px)}
.pill{display:none;align-items:center;gap:6px;background:rgba(17,17,17,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 6px 6px 18px;color:#fff}
.pill nav{display:flex;align-items:center}
.pill nav a{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:8px 11px;border-radius:999px;transition:color .2s,background .2s;white-space:nowrap}
.pill nav a:hover{color:var(--yellow)}
.pill nav a[aria-current="page"]{color:var(--yellow)}
.social{display:flex;gap:6px;margin:0 8px 0 6px}
.social a{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;transition:transform .25s}
.social a:hover{transform:scale(1.12)}
.social svg{width:12px;height:12px;fill:#fff}
.s-yt{background:#FF0000}.s-ig{background:radial-gradient(circle at 30% 110%,#FFD86F,#FC6F45 40%,#E23D8C 65%,#A43ECF)}.s-x{background:#1DA1F2}
.pill .btn{min-height:32px;padding:0 16px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.burger{width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(17,17,17,.82);color:#fff;display:grid;place-items:center;cursor:pointer}
.burger span{display:grid;gap:4px}.burger i{display:block;width:18px;height:2px;background:#fff;border-radius:2px;transition:transform .3s,opacity .3s}
.menu-open .burger i:nth-child(1){transform:translateY(6px) rotate(45deg)}.menu-open .burger i:nth-child(2){opacity:0}.menu-open .burger i:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
.menu{position:fixed;inset:0;z-index:55;background:var(--navy);color:#fff;padding:104px var(--gut) 40px;display:flex;flex-direction:column;gap:0;opacity:0;visibility:hidden;transition:opacity .4s,visibility 0s .4s;overflow:auto}
.menu-open .menu{opacity:1;visibility:visible;transition:opacity .4s}
.menu a{font-family:var(--f-serif);font-size:clamp(21px,5.6vw,25px);line-height:1.2;padding:15px 0;border-bottom:1px solid rgba(255,255,255,.1);letter-spacing:.005em;transition:color .25s}.menu a:hover{color:var(--yellow)}
.menu a[aria-current="page"]{color:var(--yellow);font-style:italic}
.menu .btn{margin-top:30px;align-self:flex-start;font-family:var(--f-sans);font-size:14px;padding:15px 26px;border-bottom:0;letter-spacing:0}
.menu-open{overflow:hidden}
@media (min-width:1180px){.pill{display:flex}.burger,.menu{display:none}}

/* shared dark hero */
.hero{position:relative;color:#fff;background:var(--navy);isolation:isolate;overflow:hidden}
.hero__bg{position:absolute;inset:0;z-index:-2}
.hero__bg img,.hero__bg video{width:100%;height:100%;object-fit:cover;display:block}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(10,10,14,.61) 0%,rgba(10,10,14,.41) 45%,rgba(10,10,14,.08) 80%),linear-gradient(180deg,rgba(10,10,14,.41) 0%,transparent 25%,transparent 70%,rgba(10,10,14,.38) 100%)}
.hero__in{min-height:min(100svh,780px);display:flex;flex-direction:column;justify-content:center;padding-top:120px;padding-bottom:60px}
.hero h1{font-size:clamp(33px,5.2vw,96px)}
.hero h1 .ln{display:block;overflow:hidden;padding-bottom:.06em}
.hero h1 .ln>span{display:inline-block}
.hero h1 .ln-m{display:none}
@media (max-width:1149px){.hero h1 .ln-d{display:none}.hero h1 .ln-m{display:block}}
.hero p.lead{margin-top:20px;font-size:clamp(15.5px,1.3vw,17.5px);max-width:50ch;color:rgba(255,255,255,.85)}
.hero__cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.stats{display:flex;align-items:stretch;gap:0;margin-top:34px;align-self:flex-start;background:rgba(20,20,24,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:12px 6px}
.stats div{padding:2px clamp(16px,2.4vw,30px);text-align:center;display:grid}
.stats div+div{border-left:1px solid rgba(255,255,255,.3)}
.stats b{font-family:var(--f-hero);font-weight:700;font-size:clamp(24px,2.6vw,34px);line-height:1.1}
.stats span{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.8)}
@media (max-width:520px){.stats{align-self:stretch}.stats div{flex:1;padding:2px 8px}.stats:has(div:nth-child(4)){display:grid;grid-template-columns:1fr 1fr;row-gap:12px}.stats div{padding:2px 8px}.stats div+div{border-left:0}.stats div:nth-child(even){border-left:1px solid rgba(255,255,255,.3)}.stats div:nth-child(3):last-child{grid-column:1/-1}}

/* sections */
.sec{padding:clamp(48px,6.25vw,120px) 0}
.sec--cream{background:var(--cream)}
.sec--grey{background:var(--grey)}
.sec--navy{background:var(--navy);color:#fff}
.head{display:grid;gap:12px;margin-bottom:clamp(34px,5vw,56px)}
.head--row{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:18px}

/* cards */
.card{background:#fff;border-radius:18px;box-shadow:var(--shadow)}
.quote{position:relative;padding:24px 24px 28px;overflow:hidden}
.quote__who{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.quote__av{width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-serif);font-size:24px;color:#fff;background:var(--red);box-shadow:0 0 0 3px #fff,0 0 0 4px var(--line)}
.quote__who b{display:block;font-weight:600;font-size:16px;line-height:1.2}
.quote__who small{color:var(--mute);font-size:12.5px}
.quote p{font-style:italic;font-size:15px;color:var(--soft);position:relative;z-index:1}
.quote::after{content:"\201D";position:absolute;right:14px;bottom:-70px;font-family:var(--f-serif);font-size:150px;line-height:1;color:#FCEFE7;z-index:0}

/* timeline (the "Journeys across time" pattern) */
.tl{list-style:none;position:relative;display:grid;gap:22px;padding-left:28px}
.tl::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:1.5px;background:rgba(210,82,46,.35)}
.tl__fill{position:absolute;left:5px;top:8px;bottom:8px;width:1.5px;background:var(--red);transform-origin:top;transform:scaleY(0)}
.tl li{position:relative}
.tl li::before{content:"";position:absolute;left:-28px;top:7px;width:11px;height:11px;border-radius:50%;border:1.5px solid var(--red);background:var(--cream);transition:background .3s}
.tl li.on::before{background:var(--red)}
.tl h3{font-family:var(--f-serif);font-weight:500;font-size:clamp(19px,1.6vw,22px);line-height:1.25}
.tl li.on h3{color:var(--red)}
.tl p{font-family:var(--f-serif);font-size:14.5px;color:var(--soft);margin-top:4px;line-height:1.5}

/* book cards with store badges (the "Stories that build character" pattern) */
.books{display:grid;gap:clamp(34px,4vw,48px) clamp(18px,2.4vw,30px)}
@media (min-width:600px){.books{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1000px){.books{grid-template-columns:repeat(3,1fr)}.books--4{grid-template-columns:repeat(4,1fr)}}
.bk{display:flex;flex-direction:column;align-items:center;text-align:center}
.bk__cover{position:relative;display:block;width:100%;perspective:900px}
.bk__cover img{width:100%;aspect-ratio:1015/760;object-fit:contain;transition:transform .5s var(--ease);filter:drop-shadow(0 18px 18px rgba(0,0,0,.18))}
.age{position:absolute;left:8%;top:-4px;z-index:2;width:50px;height:50px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;text-align:center;font-family:var(--f-hero);font-weight:700;font-size:11px;line-height:1;letter-spacing:.04em;box-shadow:0 6px 14px rgba(75,163,227,.4)}
.age b{display:block;font-size:15px}
.bk h3{font-weight:700;font-size:17px;margin-top:14px;line-height:1.3}
.bk h3 a{display:inline-block;padding:10px 0;margin:-10px 0}
.bk h3 a:hover{color:var(--red)}
.bk p{font-size:13.5px;color:var(--soft);margin-top:6px;max-width:32ch}
.stores{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px;width:100%;max-width:330px}
.store{display:flex;align-items:stretch;height:38px;border-radius:7px;background:var(--blue);color:#fff;overflow:hidden;text-align:left;transition:transform .25s,background .25s}
.store:hover{background:var(--blue-d);transform:translateY(-2px)}
.store i{flex:0 0 34%;background:#fff;display:grid;place-items:center;padding:0 6px;border:1.5px solid var(--blue);border-radius:7px 0 0 7px}
.store i img{max-height:13px;max-width:100%;width:auto}
.store i img[src*="PDF"]{max-height:20px}
.store span{display:grid;align-content:center;padding:0 6px;line-height:1.05;min-width:0}
.store small{font-size:11px;opacity:.9;white-space:nowrap}
.store b{font-size:14px;font-weight:700}

/* email chart CTA (navy) */
.chart{background:var(--navy);color:#fff;padding:clamp(60px,8vw,100px) 0;overflow:hidden}
.chart__grid{display:grid;gap:clamp(30px,5vw,60px);align-items:center}
.chart__grid>*{min-width:0}
.chart h2{font-size:clamp(34px,4.4vw,56px);margin:16px 0 18px;color:#fff}
.chart h2 em{color:var(--red)}
.chart p{color:rgba(255,255,255,.82);max-width:52ch;font-size:15px}
.jform{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;max-width:520px}
.jform input{flex:1 1 200px;min-width:0;height:48px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:#25304A;color:#fff;padding:0 16px}
.jform input::placeholder{color:rgba(255,255,255,.5)}
.jform .msg{flex-basis:100%;font-size:13px;color:rgba(255,255,255,.75);min-height:1.4em}
.chart__img{border-radius:6px;overflow:hidden;transform:rotate(1.5deg);box-shadow:0 30px 60px rgba(0,0,0,.4);background:#F3D8A8}
@media (min-width:960px){.chart__grid{grid-template-columns:1fr 1fr}}

/* footer */
.foot{background:var(--foot);color:#E6E6E6;padding:56px 0 30px;font-size:13.5px}
.foot__top{display:grid;gap:30px}
.foot h4{color:var(--red);font-weight:600;font-size:15px;margin-bottom:12px}
.foot ul{list-style:none;display:grid;gap:9px}
.foot a:hover{color:var(--yellow)}
.foot .soc{display:flex;gap:18px;margin-top:20px}
.foot .soc a{display:grid;place-items:center;padding:12px;margin:-12px}
.foot .soc svg{width:16px;height:16px;fill:#fff}
.foot__bottom{margin-top:40px;padding-top:20px;border-top:1px solid rgba(255,255,255,.1);text-align:center;color:#bdbdbd;font-size:12.5px}
@media (min-width:860px){.foot__top{grid-template-columns:1.6fr 1fr 1fr 1fr}}

/* concept badge */
.bar-on .concept{opacity:0;pointer-events:none}
.concept{transition:opacity .3s;position:fixed;left:14px;bottom:14px;z-index:70;background:var(--ink);color:#fff;font-size:12px;border-radius:999px;padding:8px 14px;box-shadow:0 8px 20px rgba(0,0,0,.25);display:flex;gap:8px;align-items:center}
.concept a{color:var(--yellow);text-decoration:underline}
@media (max-width:600px){.concept{left:8px;right:auto;bottom:8px;font-size:12px;padding:6px 12px}.concept .x{display:none}}

/* reveal */
.rv{opacity:0;transform:translateY(26px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.rv.in{opacity:1;transform:none}
.no-js .rv{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}

.bk{container-type:inline-size}
@container (max-width:315px){.stores{grid-template-columns:1fr;max-width:210px;margin-inline:auto}}

/* rails: card rows that become swipe sliders on tablet and phone; book rows stay a grid */
.rail{display:grid;gap:clamp(18px,2vw,28px);grid-template-columns:repeat(var(--cols,4),minmax(0,1fr))}
.dots{display:none;justify-content:center;margin-top:4px;color:var(--ink)}
.dots button{width:36px;height:36px;border:0;background:none;display:grid;place-items:center;cursor:pointer;padding:0;color:inherit}
.dots button::before{content:"";width:8px;height:8px;border-radius:4px;background:currentColor;opacity:.25;transition:width .3s var(--ease),opacity .3s}
.dots button[aria-current="true"]::before{width:22px;opacity:1}
.dots--light{color:#fff}
@media (max-width:1149px){
  .rail{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:var(--cw,min(340px,80vw));gap:16px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scrollbar-width:none;margin-inline:calc(var(--gut) * -1);padding:8px var(--gut) 14px;scroll-padding-inline:var(--gut)}
  .rail::-webkit-scrollbar{display:none}
  .rail>*{scroll-snap-align:start;min-width:0}
  .rail+.dots{display:flex}
  .dots--x{display:flex}
}

/* plan switch (Monthly / Annually), from the Films and Home Figma */
.plan{display:inline-flex;background:#fff;border-radius:999px;padding:5px;box-shadow:var(--shadow)}
.plan button{border:0;background:none;border-radius:999px;min-height:46px;padding:0 22px;font-size:14px;font-weight:300;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .25s}
.plan button b{font-weight:700;font-size:18px}
.plan button[aria-checked="true"]{background:#FFCB03}
.plan-row{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.btn--sky{background:#00AEEF;color:#fff;border-radius:12px;min-height:56px;padding:0 30px;font-size:15px}
.btn--sky:hover{background:#0095CC;box-shadow:0 10px 24px rgba(0,174,239,.3)}
.btn--play{padding-right:6px}
.btn--play i{width:36px;height:36px;border-radius:50%;background:#000;display:grid;place-items:center;font-style:normal}
.btn--play i::before{content:"";border-left:11px solid var(--yellow);border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}
.foot ul a{display:inline-block;padding:9px 0;margin:-9px 0}

/* compact footer on tablet and phone (Figma): link columns first, tagline and socials below */
@media (max-width:859px){
  .foot{padding-top:44px}
  .foot__top{grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 20px}
  .foot__top>div:first-child{order:4;grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:20px;border-top:1px solid rgba(255,255,255,.1);padding-top:22px}
  .foot__top>div:first-child p{max-width:42ch}
  .foot__top>div:first-child .soc{margin-top:0;flex:none}
  .foot__bottom{margin-top:26px}
}
@media (min-width:600px) and (max-width:859px){
  .foot{padding:44px 0 0}
  .foot h4{font-size:20px;line-height:25px;margin:0 0 12px}
  .foot ul{gap:10px}.foot ul a{font-size:16px;line-height:23px}
  .foot__top{gap:28px 20px}
  .foot__top>div:first-child{padding-top:22px}
  .foot__bottom{margin-top:25px;padding:19px 0 26px;text-align:left}
}
@media (max-width:599px){
  .foot__top{grid-template-columns:repeat(2,minmax(0,1fr))}
  .foot__top>div:nth-child(4){grid-column:1/-1}
  .foot__top>div:first-child{flex-direction:column;text-align:center;border-top:0;padding-top:8px;gap:16px}
}

/* tablet + phone: books are a swipe slider of full cards, store buttons included (variant 1) */
.bk__buy{display:none!important}
@media (max-width:1149px){
  .books,.books--4,.stories .rail.rail{display:grid;grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:min(300px,80vw);gap:18px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scrollbar-width:none;margin-inline:calc(var(--gut) * -1);padding:16px var(--gut) 18px;scroll-padding-inline:var(--gut)}
  .books::-webkit-scrollbar{display:none}
  .books>*,.books--4>*{scroll-snap-align:start;min-width:0}
  .bk .stores{grid-template-columns:1fr 1fr;max-width:none}
  .stories .rail+.dots{display:flex}
}
/* books look the same on every page: on hover the cover lifts and the title turns orange (as on the approved Home) - no white card */
@media (hover:hover) and (min-width:1150px){
  .bk__cover img{transition:transform .45s cubic-bezier(.2,.7,.2,1),filter .45s}
  .bk:hover .bk__cover img,.bk:focus-within .bk__cover img{transform:translateY(-12px) scale(1.04);filter:drop-shadow(0 26px 22px rgba(0,0,0,.22))}
  .bk h3 a{transition:color .25s}
  .bk:hover h3 a,.bk:focus-within h3 a{color:#F07C1F}
}
@media (prefers-reduced-motion:reduce){.bk,.bk:hover{transform:none}}


/* desktop: book cards line up row by row: titles and texts start together, store badges sit on one line */
@media (min-width:1150px){
  .books,.stories .rail{align-items:stretch}
  .bk h3{min-height:calc(1.3em + 0px)}
  .bk>p{min-height:2lh;text-wrap:pretty}
  .bk .stores{margin-top:auto;padding-top:16px}
}

/* tablet + phone: "Buy" opens a sheet with the stores, so Amazon is one more tap away */
.buy-sheet{position:fixed;inset:auto 0 0 0;margin:0;width:100%;max-width:none;max-height:none;border:0;padding:0;background:transparent;color:var(--ink)}
.buy-sheet::backdrop{background:rgba(10,10,14,.5);opacity:0;transition:opacity .3s}
.buy-sheet[open]::backdrop{opacity:1}
.buy-sheet__in{background:#fff;border-radius:22px 22px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.2);transform:translateY(100%);transition:transform .38s var(--ease);max-width:560px;margin:0 auto}
.buy-sheet.show .buy-sheet__in{transform:none}
.buy-sheet__grip{display:block;width:40px;height:4px;border-radius:2px;background:#d9d9d9;margin:0 auto 14px}
.buy-sheet__hd{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.buy-sheet__hd img{width:54px;height:auto;filter:drop-shadow(0 6px 8px rgba(0,0,0,.18))}
.buy-sheet__hd b{display:block;font-size:16px;line-height:1.3}
.buy-sheet__hd small{font-size:13px;color:var(--soft)}
.buy-sheet__x{margin-left:auto;width:40px;height:40px;border-radius:50%;border:0;background:#f2f2f2;font-size:20px;line-height:1;cursor:pointer;flex:none}
.buy-sheet .stores{display:grid;grid-template-columns:1fr;gap:10px;max-width:none;margin:0}
.buy-sheet .store{height:52px}
.buy-sheet .store i{flex-basis:38%}
.buy-sheet .store i img{max-height:16px}
.buy-sheet .store span{flex:1;padding:0 14px;grid-template-columns:1fr auto;align-items:center;display:grid}
.buy-sheet .store small{font-size:14px}
.buy-sheet .store b{font-size:17px}
@media (prefers-reduced-motion:reduce){.buy-sheet__in{transition:none}}

/* Book cards in a row line up part by part: covers, titles, texts and the first store button
   sit on the same lines even when one book has more stores or a longer text. */
@media (min-width:1150px){
  .rail>.bk,.books>.bk{display:grid;grid-row:span 4;grid-template-rows:subgrid;row-gap:0;justify-items:center;align-content:start}
  .rail>.bk .stores,.books>.bk .stores{margin-top:0;padding-top:18px;align-self:start}
}

/* Tablet and phone header and footer, from the finalized Figma (iPad Pro 11" 834 wide, iPhone 16 Pro Max 440 wide) */
.hdr__cta{display:none}
@media (max-width:1179px){
  /* logo with its TV badge at the left, a round dark menu button at the right, no contact button (final Figma) */
  .hdr__in{gap:12px}
  .hdr .logo{margin-right:auto}
  .hdr .logo img{height:52px;width:auto}
  .hdr .logo b{display:block;font-size:12px;padding:2px 5px}
  .burger{width:46px;height:46px}
}
@media (max-width:599px){
  /* footer: collapsible link groups, as in the phone Figma ("Footer / Mobile (accordion)") */
  .foot{padding:28px 0 0}
  .foot .wrap{padding-left:20px;padding-right:20px}
  .foot__top{display:flex;flex-direction:column;gap:0}
  .foot__top>div:first-child{order:5;margin:26px 0 0;border:0;padding:0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
  .foot__top>div:first-child p{max-width:none;font-size:14px;line-height:22px;color:#E6E6E6}
  .foot__top>div:not(:first-child){order:1;border-bottom:1px solid rgba(255,255,255,.12)}
  .foot__top>div:nth-child(4){grid-column:auto}
  .foot h4{margin:0;font-size:17px}
  .foot__tog{display:flex;align-items:center;justify-content:space-between;width:100%;height:56px;padding:0;background:none;border:0;color:var(--red);font:600 17px/normal Poppins,sans-serif;text-align:left;cursor:pointer}
  .foot__tog svg{width:16px;height:10px;flex:none;color:#fff;transition:transform .25s}
  .foot__tog[aria-expanded=true] svg{transform:rotate(180deg)}
  html:not(.no-js) .foot__top>div:not(:first-child) ul{display:none;padding:0 0 18px}
  html:not(.no-js) .foot__top>div.open ul{display:grid}
  .foot ul{gap:8px}.foot ul a{font-size:14px}
  .foot .soc{margin:0;gap:22px;justify-content:center;height:16px;align-items:center}
  .foot .soc svg{width:16px;height:16px}
  .foot__bottom{margin-top:24px;padding:18px 0 28px;border-top:1px solid rgba(255,255,255,.1);font-size:12.5px;line-height:19px;text-align:center}
}
@media (min-width:600px){.foot__tog{all:unset;pointer-events:none;color:inherit}.foot__tog svg{display:none}}

/* sliders glide by themselves (site.js); snapping would fight the glide */
.is-gliding{scroll-snap-type:none!important}

/* Hero buttons on every page: white at rest, yellow when pointed at or focused (how the design shows activity). */
.fhero__slide .btn.btn--yellow,.fdh__cta .btn.btn--yellow{background:#fff;border-color:#fff;color:#000}
.fhero__slide .btn.btn--yellow:hover,.fhero__slide .btn.btn--yellow:focus-visible,.fdh__cta .btn.btn--yellow:hover,.fdh__cta .btn.btn--yellow:focus-visible{background:#FEC905;border-color:#fff;color:#000;box-shadow:0 10px 28px rgba(254,201,5,.45)}

/* touch screens have no hover: the same look appears while a finger presses the button */
@media (hover:none){
  .btn,.store,.pill nav a,.menu a{-webkit-tap-highlight-color:transparent}
  .btn:active{transform:translateY(-2px)}
  .btn--yellow:active{background:var(--yellow-d);box-shadow:0 10px 24px rgba(254,201,5,.35)}
  .btn--white:active{box-shadow:0 10px 24px rgba(0,0,0,.18)}
  .btn--blue:active{background:var(--blue-d);box-shadow:0 10px 24px rgba(75,163,227,.35)}
  .btn--line:active{background:var(--ink);color:#fff}
  .btn--sky:active{background:#0095CC;box-shadow:0 10px 24px rgba(0,174,239,.3)}
  .store:active{background:var(--blue-d);transform:translateY(-2px)}
  .social a:active{transform:scale(1.12)}
  .bk h3 a:active,.foot a:active{color:var(--yellow)}
  .fhero__slide .btn.btn--yellow:active,.fdh__cta .btn.btn--yellow:active{background:#FEC905;border-color:#fff;color:#000;box-shadow:0 10px 28px rgba(254,201,5,.45)}
}

/* Shared page chrome: the header pill and the footer follow the Home Figma on every page (Home values, scaled with the window). */
:root{--f-red:#DE3A1B;--f-coral:#F95C3F;--f-yellow:#FEC905}
@media (min-width:1150px){:root{--u0:calc(min(100vw, 1920px) / 1920)}}
@media (min-width:1180px){
  :root{--hu:calc(min(100vw, 1920px) / 1920);--f-hero:"Josefin Sans",system-ui,sans-serif}
  body .hdr,body .hdr.scrolled{padding:calc(21 * var(--hu)) 0}
  body .hdr .hdr__in{max-width:none;width:100%;margin:0;padding:0 calc(105 * var(--hu)) 0 calc(99 * var(--hu));gap:0;align-items:flex-start}
  body .logo{gap:calc(4 * var(--hu))}
  body .logo img{height:calc(63 * var(--hu));width:auto}
  body .logo b{font-size:calc(13 * var(--hu));padding:calc(1 * var(--hu)) calc(5 * var(--hu));transform:translateY(calc(10 * var(--hu)))}
  body .pill{width:calc(1349 * var(--hu));height:calc(54 * var(--hu));margin-top:calc(10 * var(--hu));padding:0 calc(13 * var(--hu)) 0 calc(32 * var(--hu));gap:0;background:rgba(0,0,0,.86);border:1px solid #73665F;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  body .pill nav{flex:1;justify-content:space-between;margin-right:calc(30 * var(--hu))}
  body .pill nav a{font-size:calc(16 * var(--hu));font-weight:700;letter-spacing:.1em;padding:calc(8 * var(--hu)) 0}
  body .pill .social{display:flex;gap:calc(20 * var(--hu));margin-right:calc(99 * var(--hu))}
  body .pill .social a{width:calc(30 * var(--hu));height:calc(30 * var(--hu))}
  body .pill .social svg{width:calc(15 * var(--hu));height:calc(15 * var(--hu))}
  body .pill .btn{min-height:0;height:calc(33 * var(--hu));width:calc(153 * var(--hu));padding:0;font-size:calc(15 * var(--hu));font-weight:700;letter-spacing:.02em;background:var(--f-yellow);color:#000}
  body .foot{background:#1D1D1D;padding:calc(59 * var(--hu)) 0 0;min-height:0;font-size:calc(17 * var(--hu))}
  body .foot{padding-top:calc(21 * var(--hu))!important}
  body .foot .wrap{max-width:none;width:100%;margin:0;padding:0 calc(182 * var(--hu)) 0 calc(209 * var(--hu))}
  body .foot__top{border-top:1px solid rgba(255,255,255,.1);padding-top:calc(14 * var(--hu))}
  body .foot ul a{white-space:nowrap}
  body .foot__top{grid-template-columns:calc(624 * var(--hu)) calc(349 * var(--hu)) calc(320 * var(--hu)) 1fr;gap:0}
  body .foot__top>div:first-child p{font-size:calc(17 * var(--hu));line-height:1.2;letter-spacing:-.3px;color:#fff;max-width:calc(472 * var(--hu));margin-left:calc(2 * var(--hu))}
  body .foot .soc{gap:calc(50 * var(--hu));margin-top:calc(23 * var(--hu));margin-left:calc(6 * var(--hu))}
  body .foot .soc svg{width:calc(25 * var(--hu));height:calc(25 * var(--hu));fill:#F6F6F6}
  body .foot h4{font-size:calc(22 * var(--hu));font-weight:600;letter-spacing:-.01em;color:var(--f-coral);line-height:calc(33 * var(--hu));margin:calc(62 * var(--hu)) 0 calc(10 * var(--hu))}
  body .foot ul{gap:0}
  body .foot ul a{font-size:calc(17 * var(--hu));line-height:calc(51 * var(--hu));letter-spacing:-.23px;color:#fff;padding:0;margin:0}
  body .foot__bottom{margin-top:calc(26 * var(--hu));padding-top:calc(60 * var(--hu));padding-bottom:calc(30 * var(--hu));border-top:1px solid rgba(255,255,255,.1);font-size:calc(15 * var(--hu));color:#fff;letter-spacing:-.2px}
}
@media (max-width:1149px){
  :root{--ht:calc(min(100vw,1149px) / 834)}
  body .hdr .hdr__in{padding-left:calc(17 * var(--ht));padding-right:calc(17 * var(--ht))}
  body .foot .wrap{padding:0 calc(33 * var(--ht))}
  body .foot .soc svg{width:16px;height:16px}
  body .foot h4{font-size:calc(15 * var(--ht))}
  body .foot ul a{font-size:calc(13.5 * var(--ht));color:#E6E6E6}
  body .foot{min-height:calc(392 * var(--ht))}

}
@media (max-width:759px){
  :root{--hp:calc(min(100vw,560px) / 440);--ht:var(--hp)}
  body .hdr .hdr__in{padding-left:calc(20 * var(--hp));padding-right:calc(20 * var(--hp))}
  body .foot__top>div:first-child{padding-top:19px}
}

/* WordPress parts: pages that keep their own content (Historical Maps, Courses, policies),
   the admin bar, and content written in the editor. */

/* The header floats over the dark hero on Home; on other pages it sits on a navy band. */
.no-hero .hdr{background:var(--navy)}
.no-hero main{padding-top:var(--hdr,88px)}

/* Logged-in admins see the WordPress bar above the fixed header. */
.admin-bar .hdr{top:32px}
@media (max-width:782px){.admin-bar .hdr{top:46px}.admin-bar.menu-open .menu{top:46px}}
/* On phones the admin bar scrolls away with the page, so the scrolled header sits at the very top. */
@media (max-width:600px){.admin-bar .hdr.scrolled{top:0}.admin-bar.menu-open .hdr{top:0}.admin-bar.menu-open .menu{top:0}}
.admin-bar .menu{top:32px}

/* Plain page: navy title band and readable text. */
.page-hd{background:var(--navy);color:#fff;padding:clamp(36px,5vw,72px) 0 clamp(30px,4vw,56px)}
.page-hd h1{font-family:var(--f-serif);font-weight:500;font-size:clamp(34px,4.6vw,60px);line-height:1.1;letter-spacing:-.01em}
.page-hd p{margin-top:12px;color:rgba(255,255,255,.8);max-width:60ch}
.page-body{padding:clamp(36px,5vw,80px) 0}
.page-body--wide .wrap{max-width:1760px}

.entry{max-width:780px}
.page-body--wide .entry{max-width:none}
.entry>*+*{margin-top:1.1em}
.entry h2,.entry h3,.entry h4{font-family:var(--f-serif);font-weight:500;line-height:1.2;margin-top:1.6em}
.entry h2{font-size:clamp(26px,2.6vw,34px)}
.entry h3{font-size:clamp(21px,2vw,26px)}
.entry a{color:#1E5FA8;text-decoration:underline;text-underline-offset:3px}
.entry ul,.entry ol{padding-left:1.3em}
.entry li+li{margin-top:.35em}
.entry img{border-radius:10px}
.entry blockquote{border-left:3px solid var(--red);padding-left:18px;font-family:var(--f-serif);font-style:italic;color:var(--soft)}
.entry table{width:100%;border-collapse:collapse;font-size:15px}
.entry th,.entry td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left}
.entry .wp-block-button__link,.entry button[type=submit],.entry input[type=submit]{display:inline-flex;align-items:center;min-height:46px;padding:0 24px;border-radius:999px;border:0;background:var(--yellow);color:var(--ink);font-weight:600;text-decoration:none;cursor:pointer}
.entry input[type=text],.entry input[type=email],.entry input[type=tel],.entry textarea,.entry select{width:100%;min-height:46px;border:1px solid var(--line);border-radius:8px;padding:10px 14px;background:#fff}
.alignwide{max-width:min(1200px,100%)}
.alignfull{width:100vw;max-width:100vw;margin-inline:calc(50% - 50vw)}
.aligncenter{margin-inline:auto}
.wp-caption-text,.wp-element-caption{font-size:13px;color:var(--mute);margin-top:6px}
.screen-reader-text{position:absolute;left:-9999px}

/* Lists of posts and search results. */
.list{display:grid;gap:28px}
.list h2{font-family:var(--f-serif);font-weight:500;font-size:clamp(22px,2.2vw,28px)}
.list h2 a:hover{color:var(--red)}
.list p{color:var(--soft);margin-top:6px}
.pager{display:flex;gap:10px;margin-top:36px;flex-wrap:wrap}
.pager .page-numbers{min-width:42px;height:42px;display:grid;place-items:center;border-radius:999px;border:1px solid var(--line);padding:0 12px}
.pager .current{background:var(--ink);color:#fff}

.nf{min-height:50vh;display:grid;align-content:center;gap:16px}

/* Books page: hero with the cover fan (a coverflow on tablet and phone) and the books in two series.
   Matched to the Books Figma: desktop 1920, tablet 834, phone 440. --k is the scale unit of the current width. */
.page-books{--u:calc(min(100vw, 1920px) / 1920);--t:calc(min(100vw, 1149px) / 834);--p:calc(min(100vw, 560px) / 440);--k:var(--u);--gx:0px}
@media (max-width:1149px){.page-books{--k:var(--t);--gx:calc(33.4 * var(--t))}}
@media (max-width:759px){.page-books{--k:var(--p);--gx:calc(17.6 * var(--p))}}

/* ---------- hero ---------- */
.page-books .hero{background:radial-gradient(ellipse at 75% 55%,#3A2A1E 0%,#1A1A22 55%,#0E1220 100%)}
.page-books .hero::after{background:radial-gradient(ellipse at 20% 50%,rgba(10,10,14,.55),transparent 60%)}
.page-books .wrap{max-width:calc(1208 * var(--u));padding:0}
.page-books .hero__in{justify-content:flex-start;position:static}
.page-books .bhero__txt{position:relative;z-index:2}
.page-books .label{font-family:var(--f-sans);font-size:calc(13 * var(--k));line-height:calc(22 * var(--k));letter-spacing:.22em;gap:calc(16 * var(--k))}
.page-books .label::before,.page-books .label--both::after{width:calc(34 * var(--k))}
.page-books .hero h1{font-size:calc(67 * var(--k));line-height:calc(76 * var(--k));letter-spacing:-.015em;margin-top:calc(18 * var(--k))!important}
.page-books .hero h1 .ln{padding-bottom:calc(4 * var(--k))}
.page-books .hero p.lead{font-family:var(--f-sans);font-size:calc(21 * var(--k));line-height:calc(29 * var(--k));max-width:calc(552 * var(--k));margin-top:calc(19.8 * var(--k))}

/* desktop fan: five covers like a hand of cards; every cover is 346.9 wide */
.fan{display:none;position:absolute;left:calc(50% + 100.4 * var(--u));top:calc(266 * var(--u));width:calc(447.6 * var(--u));height:calc(308 * var(--u));perspective:1200px;z-index:1}
.fan img{position:absolute;left:50%;top:50%;width:calc(440 * var(--u));height:auto;transform:translate(-50%,-50%) translate(calc(var(--x) * var(--u)),calc(var(--y) * var(--u))) rotate(var(--r));filter:drop-shadow(0 calc(26 * var(--u)) calc(26 * var(--u)) rgba(0,0,0,.4))}
/* symmetric: the middle cover on top, the others mirror each other on both sides */
.fan img:nth-of-type(1){--x:-232;--y:34;--r:-14deg;z-index:3}
.fan img:nth-of-type(2){--x:-122;--y:-14;--r:-7deg;z-index:4}
.fan img:nth-of-type(3){--x:0;--y:-30;--r:0deg;z-index:5}
.fan img:nth-of-type(4){--x:122;--y:-14;--r:7deg;z-index:4}
.fan img:nth-of-type(5){--x:232;--y:34;--r:14deg;z-index:3}
.fan .glow{opacity:0}
.fan.is-static .glow{opacity:1}
.fan .glow{position:absolute;inset:-14% -36%;border-radius:50%;background:radial-gradient(circle,rgba(254,201,5,.34),transparent 65%);filter:blur(10px)}
.cflow{display:none}

@media (min-width:1150px){
  .page-books .hero__in{min-height:calc(780 * var(--u));padding:calc(230 * var(--u)) 0 0}
  .page-books .bhero__txt{width:calc(618.4 * var(--u))}
  .fan{display:block}
}

/* tablet + phone: the covers become a coverflow */
@media (max-width:1149px){
  .page-books .wrap{max-width:none;padding:0 var(--gx)}
  .page-books .hero__in{min-height:0;padding-bottom:calc(36 * var(--k))}
  .page-books .hero h1{margin-top:calc(10 * var(--k))!important}
  .page-books .hero h1 .ln{margin-bottom:calc(-4 * var(--k))}
  .page-books .hero p.lead{margin-top:calc(22 * var(--k))}
  .cflow{display:block;position:relative;height:calc(534 * var(--k));margin:calc(28 * var(--k)) calc(var(--gx) * -1) 0;overflow:hidden;touch-action:pan-y}
    .cflow__glow{position:absolute;left:calc(64.5 * var(--k));top:calc(2.4 * var(--k));width:calc(705 * var(--k));height:calc(387 * var(--k));border-radius:50%;background:radial-gradient(circle,rgba(254,201,5,.34),transparent 66%);filter:blur(10px);pointer-events:none}
  .cflow__stage{position:absolute;left:0;right:0;top:0;height:calc(372 * var(--k))}
  .cflow__s{position:absolute;left:50%;top:calc(196 * var(--k));width:calc(470 * var(--k));display:block;transform:translate(-50%,-50%) translate(calc(var(--x) * var(--k)),calc(var(--y) * var(--k))) rotate(var(--r)) scale(var(--s));z-index:var(--z);transition:transform .8s cubic-bezier(.2,.7,.2,1),opacity .5s;-webkit-user-drag:none}
  .cflow__s img{display:block;width:100%;height:auto;filter:drop-shadow(0 calc(22 * var(--k)) calc(22 * var(--k)) rgba(0,0,0,.4));pointer-events:none}
  .cflow__s[data-p="0"]{--x:0;--y:0;--r:0deg;--s:1;--z:5}
  .cflow__s[data-p="-1"]{--x:-280;--y:48;--r:-7deg;--s:.7;--z:4}
  .cflow__s[data-p="1"]{--x:280;--y:48;--r:7deg;--s:.7;--z:4}
  .cflow__s[data-p="-2"]{--x:-490;--y:84;--r:-14deg;--s:.5;--z:3}
  .cflow__s[data-p="2"]{--x:490;--y:84;--r:14deg;--s:.5;--z:3}
  .cflow__s[data-p="x"]{--x:0;--y:0;--r:0deg;--s:.3;--z:1;opacity:0;pointer-events:none}
  .cflow__t{position:absolute;left:0;right:0;top:calc(394 * var(--k));text-align:center;color:#fff;font-weight:600;font-size:calc(17 * var(--k));line-height:1.2;margin:0}
  .cflow__a{position:absolute;left:0;right:0;top:calc(436.5 * var(--k));text-align:center;color:var(--yellow);font-family:var(--f-sans);font-weight:600;font-size:calc(13 * var(--k));line-height:calc(18 * var(--k));letter-spacing:.2em;text-transform:uppercase;margin:0}
  .cflow__dots{position:absolute;left:0;right:0;top:calc(476.5 * var(--k));height:8px;display:flex;justify-content:center;gap:8px}
  .cflow__dots button{position:relative;width:8px;height:8px;border:0;border-radius:4px;padding:0;background:rgba(255,255,255,.35);cursor:pointer;transition:width .3s var(--ease),background .3s}
  .cflow__dots button::after{content:"";position:absolute;inset:-12px -4px}
  .cflow__dots button[aria-current="true"]{width:24px;background:var(--yellow)}
}
@media (min-width:760px) and (max-width:1149px){
  .page-books .hero__in{padding-top:calc(140 * var(--t))}
  .page-books .hero h1{font-size:calc(59 * var(--t));line-height:calc(67 * var(--t))}
  .page-books .hero p.lead{font-size:calc(15.5 * var(--t));line-height:calc(26 * var(--t));max-width:calc(560 * var(--t))}

body.page-contact .chero__img{position:absolute;inset:0;z-index:-2;width:auto;height:auto;margin:0;border-radius:0;box-shadow:none;background:#0E1220}
body.page-contact .chero__img::after{content:none}
body.page-contact .chero__img img{position:absolute;inset:0;left:0;right:auto;top:0;width:100%;max-width:none;height:100%;object-fit:cover;object-position:74% 30%;-webkit-mask-image:none;mask-image:none;filter:none;transform:none}
/* the hero content wrapper must not form its own layer, otherwise the picture would sit above the veil */
body.page-contact .chero__in{z-index:auto}

/* History Maps and Courses: clean pictures (no old headline), framed so the people stay in view */
body.page-courses .chero__img img{object-position:80% 40%}
body.page-hm .chero__img img{object-position:62% 40%}

/* Contact: the original scribe hall picture, cleaned of its old texts, full-bleed with the common veil */
body.page-contact:not(.page-courses):not(.page-hm) .chero__img img{object-position:100% 50%}
@media (max-width:759px){
  body.page-contact:not(.page-courses):not(.page-hm) .chero__img{background:#1a0e07}
  body.page-contact:not(.page-courses):not(.page-hm) .chero__img img{left:auto;right:0;top:auto;bottom:0;width:auto;height:58%;min-width:100%;object-fit:cover;object-position:88% 50%;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 24%);mask-image:linear-gradient(180deg,transparent 0,#000 24%)}
}
/* Contact headline: three fixed lines "Connect with us / for any questions / or concerns." at every width */
body.page-contact:not(.page-courses):not(.page-hm) .chero h1 .cl{display:block}
@media (min-width:1150px){body.page-contact:not(.page-courses):not(.page-hm) .chero__txt{flex:0 1 calc(900 * var(--u0))}}
@media (min-width:1150px){body.page-contact:not(.page-courses):not(.page-hm) .chero p.lead{max-width:calc(640 * var(--u0))}}
/* Contact phone: reserve a clear band under the text so the lead never sits on the face */
@media (max-width:759px){
  body.page-contact:not(.page-courses):not(.page-hm) .chero__in{padding-bottom:62vw}
  body.page-contact:not(.page-courses):not(.page-hm) .chero__img img{height:68vw;min-height:0}
}

}
