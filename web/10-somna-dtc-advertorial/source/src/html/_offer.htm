<aside class="offer" id="@@offerId" aria-labelledby="@@offerId-title" data-reveal data-watch data-watch-once data-watch-threshold="0.15">
	<p class="offer__badge">Launch offer · 28% off</p>
	<div class="offer__body">
		<img class="offer__image" src="@img/somna/box.svg" width="800" height="520" alt="Somna warm sleep mask with power pack and USB-C cable" loading="lazy">
		<div class="offer__content">
			<h2 class="offer__title" id="@@offerId-title">Somna Warm Sleep Mask</h2>
			<p class="offer__rating"><span class="stars" aria-hidden="true">★★★★★</span> 4.8 average <span class="offer__note">(sample rating)</span></p>
			<p class="offer__price"><span class="offer__now">$49</span> <s class="offer__was"><span class="visually-hidden">Regular price </span>$69</s></p>
			<ul class="offer__perks">
				<li>Free shipping in the US and EU</li>
				<li>60-night home trial with free returns</li>
				<li>2-year warranty</li>
			</ul>
			<a href="#checkout" class="button button--fw offer__cta">Check availability</a>
			<p class="offer__stock">Ships in 1–2 business days</p>
		</div>
	</div>
</aside>
